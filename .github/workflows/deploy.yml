name: Deploy CVMatch AI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Run authentication tests
        run: npm run test:auth
      - name: Build site
        run: npm run build
      - name: Install browser and rules test tools
        run: npm install --no-save --no-package-lock @playwright/test@latest @firebase/rules-unit-testing@latest firebase-tools@latest
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test Firestore account isolation
        run: npx firebase emulators:exec --project demo-cvmatch-rules --only firestore "node --test tests/firestore.rules.test.mjs"
      - name: Run browser smoke tests
        run: npx playwright test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
